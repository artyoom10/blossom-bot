<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Blossom Flower Farm</title>
  <link rel="preload" href="/miniapp/blossom_logo.png" as="image" type="image/png" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-soft: #f1f3f5;
      --surface-muted: #eceff2;
      --text: #16181d;
      --muted: #6c7380;
      --border: #e4e8ed;
      --primary: #1f7a5b;
      --primary-soft: #e7f5ee;
      --danger: #b42318;
      --danger-soft: #fff3f2;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --shadow: 0 10px 24px rgba(18, 24, 32, .06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 96px;
      background: var(--bg);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 16px 14px;
      background: rgba(246,247,248,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(228,232,237,.75);
    }
    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .header-brand {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .header-brand-text {
      min-width: 0;
      flex: 1;
    }
    .header-logo {
      width: 42px;
      height: 42px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid rgba(228,232,237,.9);
      box-shadow: 0 2px 8px rgba(18,24,32,.06);
    }
    .header-salon-logo {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(18,24,32,.06);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .title {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 700;
    }

    .content {
      padding: 16px;
      display: grid;
      gap: 18px;
      max-width: 100%;
      overflow-x: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .section-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }
    .soft-btn {
      border: 0;
      background: var(--surface-muted);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card, .product-card, .panel, .profile-card, .request-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .category-card {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      cursor: pointer;
      text-align: left;
      box-shadow: var(--shadow);
    }
    .category-card.active {
      background: var(--primary-soft);
      border-color: #b8e1cf;
    }
    .category-name { font-weight: 700; font-size: 15px; }
    .category-meta { margin-top: 4px; color: var(--muted); font-size: 13px; }

    .stack { display: grid; gap: 12px; }

    .product-card {
      padding: 12px;
      transition: transform .15s ease, box-shadow .2s ease;
      box-shadow: 0 8px 28px rgba(18, 24, 32, .055);
    }
    .product-card:hover {
      box-shadow: 0 12px 32px rgba(18, 24, 32, .08);
    }
    .product-card.out {
      background: #eef1f3;
      border-color: #d9dfe5;
      box-shadow: none;
    }
    .product-row {
      display: flex;
      gap: 12px;
    }
    .thumb {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: #f1f3f5;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .out .thumb {
      filter: grayscale(1);
      opacity: .72;
    }
    .product-main { min-width: 0; flex: 1; }
    .product-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .product-name {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: flex-start;
      flex-shrink: 0;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid rgba(31, 122, 91, .22);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .pill.out {
      background: #eef1f4;
      color: #5c6570;
      border-color: #d5dbe3;
    }
    .product-price {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn, .btn-outline, .icon-btn {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn {
      flex: 1;
      background: var(--primary);
      color: white;
      padding: 12px 16px;
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: .55;
      background: #98a2b3;
    }
    .btn-outline {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      background: var(--surface-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .product-hero {
      width: 100%;
      max-height: min(168px, 36vh);
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: #f1f3f5;
      box-shadow: var(--shadow);
    }
    .product-hero.out {
      filter: grayscale(1);
      opacity: .8;
    }
    .panel {
      padding: 16px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .detail-card {
      background: var(--surface-soft);
      border-radius: 20px;
      padding: 14px;
    }
    .detail-label { color: var(--muted); font-size: 12px; }
    .detail-value { margin-top: 6px; font-size: 15px; font-weight: 700; }

    .cart-item {
      padding: 14px;
    }
    .cart-row {
      display: flex;
      gap: 12px;
    }
    .cart-thumb {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #f1f3f5;
      cursor: pointer;
    }
    .qty-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      border-radius: 999px;
      background: var(--surface-soft);
    }
    .qty-value {
      min-width: 48px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
    }
    .summary {
      background: #111827;
      color: white;
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      color: rgba(255,255,255,.7);
      font-size: 13px;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 24px;
      font-weight: 700;
    }
    .summary-note { margin-top: 12px; color: rgba(255,255,255,.82); font-size: 13px; }

    .empty, .warning, .success {
      border-radius: 24px;
      padding: 16px;
      font-size: 14px;
    }
    .empty { background: #edf1f4; color: var(--muted); }
    .warning { background: var(--danger-soft); color: var(--danger); border: 1px solid #ffd8d5; }
    .success { background: var(--primary-soft); color: var(--primary); border: 1px solid #bbe5cf; }

    .request-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .request-status {
      background: var(--surface-soft);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      max-width: 100%;
      text-align: center;
      white-space: normal;
      word-break: break-word;
    }
    .request-status.new { background: #edf7f2; color: var(--primary); }
    .request-status.change_requested { background: #fff4e5; color: #b54708; }
    .request-status.approved { background: #eaf6ee; color: #137333; }
    .request-status.rejected, .request-status.cancelled_by_client, .request-status.rejected_by_client { background: #fff1f1; color: var(--danger); }

    .request-card {
      padding: 16px 16px 18px;
    }
    .request-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .request-card-top-left { min-width: 0; flex: 1; }
    .request-card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      max-width: 52%;
    }
    .request-stems-hero {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--primary);
      margin-top: 12px;
      line-height: 1.1;
    }
    .request-stems-hero span { font-size: 14px; font-weight: 700; color: var(--muted); margin-left: 4px; }
    .request-sum-line {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 700;
    }
    .request-delivery-line {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .request-items-list {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .request-cancel-note {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface-soft);
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
    }
    .profile-card {
      padding: 16px;
    }
    .profile-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #ede9fe;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--text);
      overflow: hidden;
      flex-shrink: 0;
    }
    .profile-avatar img.profile-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .verified-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3b82f6;
      color: white;
      flex-shrink: 0;
    }
    .verified-badge svg {
      width: 11px;
      height: 11px;
      display: block;
    }
    .profile-stats-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary-soft) 0%, #f0f9f5 100%);
      border: 1px solid rgba(31, 122, 91, .15);
    }
    .profile-stats-panel h4 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .profile-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .profile-stat-val { font-size: 22px; font-weight: 800; color: var(--text); }
    .profile-stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .profile-avatar .nav-icon-svg {
      width: 28px;
      height: 28px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .info-card {
      background: var(--surface-soft);
      border-radius: 20px;
      padding: 14px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(430px, 100%);
      z-index: 25;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 10px 14px 18px;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .nav-grid.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .nav-grid.cols-5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
    }
    .nav-grid.cols-5 .nav-btn {
      font-size: 10px;
      padding: 8px 2px;
    }
    .nav-grid.cols-5 .nav-icon-svg {
      width: 22px;
      height: 22px;
    }
    .nav-btn {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 18px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .nav-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .nav-icon { font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .nav-badge {
      position: absolute;
      top: 6px;
      right: 14px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(400px, calc(100% - 24px));
      z-index: 50;
      background: #111827;
      color: white;
      padding: 12px 14px;
      border-radius: 18px;
      box-shadow: 0 18px 34px rgba(17,24,39,.22);
      font-size: 14px;
    }
    .hidden { display: none !important; }

    /* Boot splash (после загрузки HTML с Render) */
    .boot-splash {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, #e8f5ef 0%, #f5f0e8 45%, #eef6fb 100%);
      transition: opacity .55s ease, visibility .55s ease;
    }
    .boot-splash--done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .boot-splash__inner {
      text-align: center;
      padding: 32px 28px;
      max-width: 340px;
    }
    /* Логотип: положите файл static/blossom_logo.png (URL /miniapp/blossom_logo.png) */
    .boot-splash__logo-wrap {
      margin: 0 auto 18px;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: boot-float 2.4s ease-in-out infinite;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(228,232,237,.9);
    }
    .boot-splash__logo {
      width: 96px;
      height: 96px;
      object-fit: cover;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(31, 122, 91, .18));
    }
    @keyframes boot-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .boot-splash__brand {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--primary);
      opacity: .85;
    }
    .boot-splash__title {
      margin: 10px 0 0;
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .boot-splash__msg {
      margin: 16px 0 0;
      font-size: 15px;
      line-height: 1.45;
      color: var(--muted);
    }
    .boot-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 28px;
    }
    .boot-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      opacity: .35;
      animation: boot-dot 1.2s ease-in-out infinite;
    }
    .boot-dots span:nth-child(2) { animation-delay: .2s; }
    .boot-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes boot-dot {
      0%, 100% { opacity: .25; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1); }
    }

    .actions--single { margin-top: 12px; }
    .actions--single .btn { flex: none; width: 100%; }

    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 12px;
    }
    .qty-stepper--cart {
      margin-top: 0;
      flex: 1;
      min-width: 0;
    }
    .qty-input-field {
      flex: 1;
      min-width: 0;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 8px;
      font-weight: 700;
      font-size: 15px;
      background: var(--surface);
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
    }
    .qty-input-field:focus {
      outline: 2px solid rgba(31, 122, 91, .35);
      outline-offset: 1px;
    }
    .qty-remove {
      flex-shrink: 0;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid #ffd8d5;
    }
    .qty-remove svg {
      display: block;
      width: 20px;
      height: 20px;
    }
    .cart-qty-wrap {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-top: 12px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .cart-item .qty-stepper--cart {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px 40px;
      gap: 6px;
      align-items: center;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      flex: 1;
    }
    .cart-item .qty-stepper--cart .icon-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      flex-shrink: 0;
    }
    .cart-item .qty-stepper--cart .qty-input-field {
      min-width: 0;
      width: 100%;
      max-width: 100%;
      padding: 8px 4px;
      font-size: 14px;
    }
    .cart-row {
      max-width: 100%;
      min-width: 0;
    }
    .cart-item .cart-row > div:last-child {
      min-width: 0;
      overflow: hidden;
    }

    .nav-icon-svg {
      width: 24px;
      height: 24px;
      display: block;
    }
    .nav-icon-svg path {
      fill: currentColor;
    }

    .admin-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .admin-toolbar label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .admin-toolbar select {
      flex: 1;
      min-width: 160px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font: inherit;
      font-weight: 600;
      background: var(--surface-soft);
    }
    .admin-stats-line {
      width: 100%;
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }
    .admin-day-block {
      margin-top: 20px;
    }
    .admin-day-block:first-of-type { margin-top: 8px; }
    .admin-day-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary-soft);
    }
    .admin-salon-block {
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--surface-soft);
      border-radius: 18px;
      border: 1px solid var(--border);
    }
    .admin-salon-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .admin-salon-meta {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .admin-req-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-top: 10px;
      border-left: 4px solid var(--primary);
      box-shadow: 0 2px 8px rgba(18,24,32,.04);
    }
    .admin-req-card.status-new { border-left-color: #2d9d78; }
    .admin-req-card.status-change_requested { border-left-color: #d97706; }
    .admin-req-card.status-approved { border-left-color: #15803d; }
    .admin-req-card.status-rejected,
    .admin-req-card.status-rejected_by_client,
    .admin-req-card.status-cancelled_by_client { border-left-color: #9ca3af; }
    .admin-req-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .admin-req-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 0;
      max-width: 55%;
    }
    .admin-req-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .admin-req-lines {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .admin-seg {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .admin-seg button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .admin-seg button.active {
      background: var(--primary-soft);
      border-color: #b8e1cf;
      color: var(--primary);
    }
    .admin-flower-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .admin-flower-row:last-child { border-bottom: 0; }
    .admin-input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .admin-input-row input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      box-sizing: border-box;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .admin-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 18, 22, .45);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-end;
      padding: 0;
    }
    .admin-modal-dismiss {
      flex: 1;
      min-height: 48px;
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .admin-modal-panel {
      width: min(430px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--bg);
      border-radius: 24px 24px 0 0;
      padding: 20px 16px 28px;
      box-shadow: 0 -8px 40px rgba(0,0,0,.12);
    }
    .admin-revise-line {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .admin-revise-line input {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    .revision-banner {
      background: #fff4e5;
      border: 1px solid #fcd9a2;
      color: #92400e;
      border-radius: 18px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .revision-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .revision-actions .btn { width: 100%; }
    .revision-actions .btn-outline { width: 100%; }

    .admin-profile-strip {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 16px 18px;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, var(--primary-soft) 0%, #e8f4ef 100%);
      border: 1px solid #b8e1cf;
      box-shadow: var(--shadow);
    }
    .admin-profile-strip .nav-icon-svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      color: var(--primary);
    }
    .admin-profile-strip__title {
      font-weight: 800;
      font-size: 17px;
      color: var(--primary);
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .admin-profile-strip__text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
    }

    .order-success-overlay {
      position: fixed;
      inset: 0;
      z-index: 280;
      background: rgba(246, 247, 248, .97);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: order-success-bg .35s ease;
    }
    @keyframes order-success-bg {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .order-success-card {
      text-align: center;
      max-width: 280px;
    }
    .order-success-icon-wrap {
      width: 92px;
      height: 92px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: order-success-pop .55s cubic-bezier(.34, 1.45, .64, 1);
    }
    @keyframes order-success-pop {
      from { transform: scale(.35); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .order-success-check {
      width: 54px;
      height: 54px;
    }
    .order-success-circle {
      stroke-dasharray: 151;
      stroke-dashoffset: 151;
      animation: order-success-draw .5s ease forwards;
    }
    .order-success-tick {
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: order-success-draw .35s .4s ease forwards;
    }
    @keyframes order-success-draw {
      to { stroke-dashoffset: 0; }
    }
    .order-success-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .order-success-sub {
      margin: 10px 0 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
    }
    .action-overlay-spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 3px solid rgba(31, 122, 91, .2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: action-spin .75s linear infinite;
    }
    @keyframes action-spin {
      to { transform: rotate(360deg); }
    }
    .action-overlay-loading-text {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }
    .checkout-date-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-top: 8px;
    }
    .checkout-dow {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    .stock-lock-wrap {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eceff2;
      color: #6c7380;
      font-size: 12px;
      font-weight: 700;
      vertical-align: middle;
    }
    .stock-lock-icon {
      width: 12px;
      height: 12px;
      opacity: .85;
    }
  </style>
</head>
<body>
  <!-- После чёрного экрана Render (пробуждение сервера) показывается этот блок — он уже из вашего HTML -->
  <div id="boot-splash" class="boot-splash" aria-live="polite">
    <div class="boot-splash__inner">
      <div class="boot-splash__logo-wrap">
        <img class="boot-splash__logo" src="/miniapp/blossom_logo.png" width="96" height="96" alt="Blossom Flower Farm" />
      </div>
      <p class="boot-splash__brand">Blossom Flower Farm</p>
      <h2 class="boot-splash__title">Загружаем сад</h2>
      <p class="boot-splash__msg" id="boot-splash-msg">Связываемся с сервером…</p>
      <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div id="app"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (_) {}
      try {
        const bg = tg.themeParams && tg.themeParams.bg_color;
        if (bg && tg.setHeaderColor) tg.setHeaderColor(bg);
      } catch (_) {}
    }

    const urlParams = new URLSearchParams(window.location.search);
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

    const state = {
      activeTab: 'home',
      activeCategory: 'all',
      selectedProductId: null,
      cart: {},
      submitting: false,
      products: [],
      categories: [{ id: 'all', name: 'Все', count: 0 }],
      requests: [],
      linked: false,
      salon: null,
      meMessage: '',
      loadingProducts: true,
      loadingProfile: true,
      loadingRequests: false,
      apiError: '',
      notice: '',
      telegramId: tgUser?.id || urlParams.get('tg_id') || null,
      telegramName: [tgUser?.first_name, tgUser?.last_name].filter(Boolean).join(' ') || 'Гость',
      telegramUsername: tgUser?.username || '',
      isAdmin: false,
      stats: { approved_rub: 0, approved_stems: 0 },
      deliveryDate: '',
      rejectModal: null,
      adminRequests: [],
      adminFlowers: [],
      loadingAdmin: false,
      adminEditor: null,
      /** { phase:'loading'|'success', variant, title?, sub?, loadingText? } | null */
      actionOverlay: null,
      adminSalonFilter: 'all',
    };

    /** В JSON как строка, чтобы не терять точность у длинных Telegram id. */
    function tgIdForApi() {
      const id = state.telegramId;
      if (id === null || id === undefined || id === '') return null;
      return String(id);
    }

    function canSalonOrder() {
      return state.linked && !!state.salon;
    }

    let actionOverlayTimer = null;
    const lockIconSvg = '<svg class="stock-lock-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>';

    function formatLongDateRu(iso) {
      if (!iso || String(iso).length < 10) return '';
      try {
        const s = String(iso).slice(0, 10);
        const d = new Date(`${s}T12:00:00`);
        const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
        const wd = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} года (${wd[d.getDay()]})`;
      } catch (_) {
        return '';
      }
    }

    function weekdayShortRu(iso) {
      if (!iso || String(iso).length < 10) return '';
      try {
        const d = new Date(`${String(iso).slice(0, 10)}T12:00:00`);
        const wd = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
        return wd[d.getDay()];
      } catch (_) {
        return '';
      }
    }

    const iconNav = {
      home: '<svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
      cart: '<svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.15.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.26-.25l.04-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 22 5H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>',
      orders: '<svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14l4-2 4 2 4-2 4 2V5c0-1.1-.9-2-2-2zm0 16.99l-2-1.01-4 2.02-4-2.02-2 1.01V5h12v14.99zM8 7h8v2H8V7zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>',
      person: '<svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
      admin: '<svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>',
    };

    function haptic(type = 'light') {
      try { tg?.HapticFeedback?.impactOccurred?.(type); } catch (_) {}
    }
    function notifySuccess() {
      try { tg?.HapticFeedback?.notificationOccurred?.('success'); } catch (_) {}
    }
    function showNotice(text) {
      state.notice = text;
      render();
      window.clearTimeout(showNotice._timer);
      showNotice._timer = window.setTimeout(() => {
        state.notice = '';
        render();
      }, 2500);
    }

    function money(value) {
      const num = Number(value || 0);
      return `${Math.round(num)} ₽`;
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function setBootMessage(text) {
      const el = document.getElementById('boot-splash-msg');
      if (el) el.textContent = text;
    }

    function hideBootSplash() {
      const el = document.getElementById('boot-splash');
      if (!el) return;
      el.classList.add('boot-splash--done');
      window.setTimeout(() => el.remove(), 600);
    }

    /** Остаток: свободно + зарезервировано в заявках (серый замок). */
    function productStockLine(item) {
      const stem = String(item.stem ?? '').trim();
      const hasStem = stem && stem !== '—' && stem !== '-';
      const stemPart = hasStem ? `${escapeHtml(stem)} · ` : '';
      const avail = Number(item.stock ?? 0);
      const res = Number(item.reserved_pending ?? 0);
      const lock = res > 0
        ? `<span class="stock-lock-wrap" title="В неподтверждённых заявках">${lockIconSvg}<span>${res}</span></span>`
        : '';
      return `${stemPart}В наличии: <b>${avail}</b>${lock}`;
    }

    const trashIconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

    function renderQtyStepper(item, variant) {
      const id = item.id;
      const qty = state.cart[id] || 0;
      if (qty <= 0) return '';
      const extra = variant === 'cart' ? ' qty-stepper--cart' : '';
      return `
        <div class="qty-stepper${extra}">
          <button type="button" class="icon-btn qty-step" data-action="qty-minus" data-id="${id}" aria-label="Уменьшить на 5" onmousedown="event.preventDefault()">−</button>
          <input type="text" class="qty-input-field" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
            data-action="qty-input" data-id="${id}" value="${qty}" aria-label="Количество стеблей" />
          <button type="button" class="icon-btn qty-step" data-action="qty-plus" data-id="${id}" aria-label="Добавить 5" onmousedown="event.preventDefault()">+</button>
          <button type="button" class="icon-btn qty-remove" data-action="remove" data-id="${id}" aria-label="Убрать из корзины" onmousedown="event.preventDefault()">${trashIconSvg}</button>
        </div>
      `;
    }

    function requestStatusLabel(status, forAdmin) {
      if (forAdmin) {
        const amap = {
          new: 'Новая',
          approved: 'Подтверждена',
          rejected: 'Отмена админом',
          rejected_by_client: 'Отклонена клиентом',
          change_requested: 'Нужно изменить',
          cancelled_by_client: 'Отмена клиентом',
        };
        return amap[status] || status;
      }
      const map = {
        new: 'Новая',
        approved: 'Подтверждена',
        rejected: 'Отклонена',
        rejected_by_client: 'Отклонена',
        change_requested: 'Изменена',
        cancelled_by_client: 'Отменена вами',
      };
      return map[status] || status;
    }

    function formatRequestDate(iso) {
      return formatLongDateRu(iso);
    }

    function salonLogoUrl(salonId) {
      if (salonId == null || salonId === '') return '';
      return `/miniapp/salon_${salonId}.png`;
    }

    function headerSalonLogoHtml() {
      const sid = state.salon && state.salon.id;
      if (!sid) return '';
      const src = salonLogoUrl(sid);
      return `<img class="header-salon-logo" src="${escapeAttr(src)}" alt="" width="44" height="44" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'" />`;
    }

    function profileSalonAvatarInner() {
      if (state.isAdmin) {
        return `<span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--primary);background:var(--primary-soft);">${iconNav.admin}</span>`;
      }
      const sid = state.salon && state.salon.id;
      if (sid) {
        return `<img class="profile-avatar-img" src="${escapeAttr(salonLogoUrl(sid))}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('🏬'))" />`;
      }
      return '🏬';
    }

    const verifiedSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';

    function categoryId(name) {
      return name === 'Все' ? 'all' : name;
    }

    function setActiveTab(tab) {
      state.activeTab = tab;
      if (tab === 'admin' && state.isAdmin) {
        loadAdminCatalog();
      }
      if (tab === 'orders' && state.isAdmin) {
        loadAdminRequests();
      }
      render();
    }

    function selectedProduct() {
      return state.products.find((item) => item.id === state.selectedProductId) || null;
    }

    function cartItems() {
      return Object.entries(state.cart)
        .map(([id, qty]) => {
          const product = state.products.find((item) => String(item.id) === String(id));
          if (!product || qty <= 0) return null;
          return {
            ...product,
            qty,
            total: qty * Number(product.price || 0),
          };
        })
        .filter(Boolean);
    }

    function cartCount() {
      return cartItems().reduce((sum, item) => sum + item.qty, 0);
    }

    function cartTotal() {
      return cartItems().reduce((sum, item) => sum + item.total, 0);
    }

    function filteredProducts() {
      if (state.activeCategory === 'all') return state.products;
      return state.products.filter((item) => item.category === state.activeCategory);
    }

    function initDataHeaders(extra = {}) {
      return {
        'Content-Type': 'application/json',
        ...(tg && tg.initData ? { 'X-Telegram-Init-Data': tg.initData } : {}),
        ...extra,
      };
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    async function loadAdminRequests() {
      if (!state.isAdmin) return;
      state.loadingAdmin = true;
      render();
      try {
        const res = await fetch('/api/admin/requests', { headers: initDataHeaders() });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || String(res.status));
        state.adminRequests = data.requests || [];
      } catch (err) {
        state.adminRequests = [];
        showNotice(err.message || 'Не удалось загрузить заявки');
      } finally {
        state.loadingAdmin = false;
        render();
      }
    }

    async function loadAdminCatalog() {
      if (!state.isAdmin) return;
      state.loadingAdmin = true;
      render();
      try {
        const res = await fetch('/api/admin/catalog', { headers: initDataHeaders() });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || String(res.status));

    function isRetryableApiError(err, res) {
      if (err && err.name === 'TypeError') return true;
      if (res == null) return true;
      const s = res.status;
      return s === 502 || s === 503 || s === 504 || s === 524 || s === 408 || s === 0;
    }

    /** Повторы при «засыпании» Render и сетевых сбоях */
    async function apiWakeAware(path, options = {}) {
      const maxAttempts = 14;
      let lastErr = new Error('Сеть недоступна');
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        let res = null;
        try {
          res = await fetch(path, {
            headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
            ...options,
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok !== false) return data;
          lastErr = new Error(data.error || `HTTP ${res.status}`);
          if (!isRetryableApiError(null, res)) throw lastErr;
        } catch (e) {
          lastErr = e instanceof Error ? e : new Error(String(e));
          if (!isRetryableApiError(lastErr, res)) throw lastErr;
        }
        setBootMessage('Сервер ненадолго «заснул» — подождите, он просыпается…');
        await sleep(900 + attempt * 350);
      }
      throw lastErr;
    }

    function changeQty(productId, delta) {
      const product = state.products.find((p) => String(p.id) === String(productId));
      const current = state.cart[productId] || 0;
      let next = current + delta;
      if (next <= 0) {
        delete state.cart[productId];
      } else {
        const maxStock = product && Number.isFinite(Number(product.stock)) ? Number(product.stock) : null;
        if (maxStock != null && next > maxStock) {
          next = maxStock;
          showNotice(`В наличии не более ${maxStock} шт.`);
        }
        state.cart[productId] = next;
      }
      haptic('light');
      render();
    }

    function setQtyFromInput(productId, raw) {
      const product = state.products.find((p) => String(p.id) === String(productId));
      const digits = String(raw || '').replace(/\D/g, '');
      const v = parseInt(digits, 10);
      if (!Number.isFinite(v) || v < 1) {
        delete state.cart[productId];
      } else {
        let next = v;
        const maxStock = product && Number.isFinite(Number(product.stock)) ? Number(product.stock) : null;
        if (maxStock != null && next > maxStock) {
          next = maxStock;
          showNotice(`В наличии не более ${maxStock} шт.`);
        }
        state.cart[productId] = next;
      }
      haptic('light');
      render();
    }

      if (!tg?.MainButton) return;
      try { tg.MainButton.offClick(submitOrder); } catch (_) {}
      try { tg.MainButton.offClick(goToCheckout); } catch (_) {}
      try { tg.MainButton.offClick(openCart); } catch (_) {}
      try { tg.BackButton.offClick(goBack); } catch (_) {}

      const count = cartCount();
      if (state.activeTab === 'home' && count > 0) {
        tg.MainButton.setText(`Корзина · ${count}`);
        tg.MainButton.show();
        tg.MainButton.enable();
        tg.MainButton.onClick(openCart);
      } else if (state.activeTab === 'cart' && count > 0) {
        tg.MainButton.setText('Оформить заявку');
        tg.MainButton.show();
        tg.MainButton.enable();
        tg.MainButton.onClick(goToCheckout);
      } else if (state.activeTab === 'checkout' && count > 0) {
        tg.MainButton.setText(state.submitting ? 'Отправляем...' : `Отправить заявку · ${money(cartTotal())}`);
        tg.MainButton.show();
        if (state.submitting) tg.MainButton.disable(); else tg.MainButton.enable();
        tg.MainButton.onClick(submitOrder);
      } else {
        tg.MainButton.hide();
      }

      if (state.adminEditor || state.activeTab === 'product' || state.activeTab === 'checkout') {
        tg.BackButton.show();
        tg.BackButton.onClick(goBack);
      } else {
        tg.BackButton.hide();
      }
    }

    function formatAdminDayLabel(dayKey) {
      if (!dayKey || dayKey === 'unknown') return 'Без даты';
      const d = new Date(`${dayKey}T12:00:00.000Z`);
      return d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatAdminTime(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      } catch (_) {
        return '';
      }
    }

    function filterAdminRequestsBySalon(requests, salonFilter) {
      if (!salonFilter || salonFilter === 'all') return [...requests];
      return requests.filter((r) => ((r.salon_name || '').trim() || '—') === salonFilter);
    }

    function adminSalonFilterOptions(requests) {
      const set = new Set();
      requests.forEach((r) => set.add(((r.salon_name || '').trim() || '—')));
      return [...set].sort((a, b) => a.localeCompare(b, 'ru'));
    }

    function buildAdminRequestBoard(requests) {
      const list = [...requests].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      const byDate = new Map();
      for (const r of list) {
        let dayKey = 'unknown';
        if (r.created_at) {
          try {
            dayKey = new Date(r.created_at).toISOString().slice(0, 10);
          } catch (_) {}
        }
        if (!byDate.has(dayKey)) byDate.set(dayKey, []);
        byDate.get(dayKey).push(r);
      }
      const dates = [...byDate.keys()].sort((a, b) => {
        if (a === 'unknown') return 1;
        if (b === 'unknown') return -1;
        return b.localeCompare(a);
      });
      return dates.map((dayKey) => {
        const rows = byDate.get(dayKey);
        const bySalon = new Map();
        for (const r of rows) {
          const sn = (r.salon_name || '').trim() || '—';
          if (!bySalon.has(sn)) bySalon.set(sn, []);
          bySalon.get(sn).push(r);
        }
        const salons = [...bySalon.keys()].sort((a, b) => a.localeCompare(b, 'ru'));
        return {
          dayKey,
          dayLabel: formatAdminDayLabel(dayKey),
          salons: salons.map((name) => ({
            name,
            requests: bySalon.get(name).sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)),
          })),
        };
      });
    }

      const canAct = item.status === 'new' || item.status === 'change_requested';
      return `

          <div class="admin-req-top">
            <div>
              <div class="product-name">#${item.id}</div>
              <div class="request-stems-hero" style="margin-top:8px;font-size:22px;">${item.total_stems || 0}<span>стеблей</span></div>
              <div class="muted" style="margin-top:4px;font-size:13px;font-weight:700;">${money(item.total_amount || 0)}</div>

            <div class="order-success-icon-wrap" style="${iconWrapStyle}">
              <svg class="order-success-check" viewBox="0 0 52 52" aria-hidden="true">
                <circle class="order-success-circle" cx="26" cy="26" r="23" fill="none" stroke="currentColor" stroke-width="2.5"/>
                <path class="order-success-tick" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14 27l9 9 17-20"/>
              </svg>
            </div>
            <p class="order-success-title">${escapeHtml(ov.title || 'Готово')}</p>
            <p class="order-success-sub">${escapeHtml(ov.sub || '')}</p>
          </div>
        </div>
      `;
    }

    function renderNav() {
      const count = cartCount();
      const tabs = state.isAdmin
        ? [
            ['home', iconNav.home, 'Каталог'],
            ['orders', iconNav.orders, 'Заявки'],
            ['profile', iconNav.person, 'Профиль'],
            ['admin', iconNav.admin, 'Админ'],
          ]
        : [
            ['home', iconNav.home, 'Каталог'],
            ['cart', iconNav.cart, 'Корзина'],
            ['orders', iconNav.orders, 'Заявки'],
            ['profile', iconNav.person, 'Профиль'],
          ];
      const gridClass = 'nav-grid cols-4';
      return `
        <nav class="bottom-nav">
          <div class="${gridClass}">
            ${tabs.map(([tab, iconHtml, label]) => `
              <button class="nav-btn ${state.activeTab === tab ? 'active' : ''}" data-action="tab" data-tab="${tab}" type="button">
                <span class="nav-icon">${iconHtml}</span>
                <span>${label}</span>
                ${tab === 'cart' && count > 0 ? `<span class="nav-badge">${count}</span>` : ''}
              </button>
            `).join('')}
          </div>
        </nav>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      const screen = state.activeTab === 'admin' ? renderAdmin()
        : state.activeTab === 'home' ? renderHome()
        : state.activeTab === 'product' ? renderProduct()
        : state.activeTab === 'cart' ? renderCart()
        : state.activeTab === 'checkout' ? renderCheckout()
        : state.activeTab === 'orders' ? renderOrdersView()
        : renderProfile();

      app.innerHTML = `
        <div class="app">
          ${renderHeader()}
          <main class="content">
            ${state.apiError ? `<div class="warning">${escapeHtml(state.apiError)}</div>` : ''}
            ${screen}
          </main>
          ${renderNav()}
          ${state.notice ? `<div class="toast">${escapeHtml(state.notice)}</div>` : ''}
        </div>
        ${renderAdminEditorModal()}
        ${renderRejectModal()}
        ${renderActionOverlay()}
      `;

      updateTelegramButtons();
    }

    document.addEventListener('change', (event) => {
      const t = event.target;
      if (t && t.matches && t.matches('[data-checkout-delivery]')) {
        state.deliveryDate = (t.value || '').slice(0, 10);
        render();
        return;
      }
      if (t && t.matches && t.matches('[data-action="admin-filter-salon"]')) {
        const v = t.value;
        state.adminSalonFilter = v === 'all' ? 'all' : decodeURIComponent(v);
        render();
        return;
      }
      if (t && t.matches && t.matches('[data-admin-flower-vis]')) {
        const fid = Number(t.dataset.id);
        const f = state.adminFlowers.find((x) => x.id === fid);
        if (f) f.catalog_visible = t.checked;
      }
    });
    document.addEventListener('input', (event) => {
      const t = event.target;
      if (t && t.matches && t.matches('[data-admin-flower-price]')) {
        const fid = Number(t.dataset.id);
        const f = state.adminFlowers.find((x) => x.id === fid);
        if (f) {
          const v = t.value.trim();
          f.price_rub = v === '' ? null : v.replace(',', '.');
        }
      }
      if (t && t.matches && t.matches('[data-admin-flower-stock]')) {
        const fid = Number(t.dataset.id);
        const f = state.adminFlowers.find((x) => x.id === fid);
        if (f) {
          const v = t.value.trim();
          f.stems_count = v === '' ? null : v;
        }
      }
    });

    document.addEventListener('click', async (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      if (action === 'tab') {
        setActiveTab(target.dataset.tab);
      }
      if (action === 'category') {
        state.activeCategory = target.dataset.category;
        render();
      }
      if (action === 'reset-category') {
        state.activeCategory = 'all';
        render();
      }
      if (action === 'open-product') {
        openProduct(Number(id));
      }
      if (action === 'add') {
        const product = state.products.find((item) => String(item.id) === String(id));
        if (product) addToCart(product);
      }
      if (action === 'qty-minus') {
        changeQty(id, -5);
      }
      if (action === 'qty-plus') {
        changeQty(id, 5);
      }
      if (action === 'remove') {
        changeQty(id, -999999);
      }
      if (action === 'reload-requests') {
        if (state.isAdmin) await loadAdminRequests();
        else await loadRequests();
      }
      if (action === 'admin-reload-requests') {
        await loadAdminRequests();
      }
      if (action === 'cancel-request') {
        await cancelRequest(id);
      }
      if (action === 'admin-reload-catalog') {
        await loadAdminCatalog();
      }
      if (action === 'admin-save-catalog') {
        try {
          await saveAdminCatalog();
        } catch (e) {
          showNotice(e.message || 'Ошибка сохранения');
        }
      }
      if (action === 'admin-open-req') {
        await openAdminEditor(Number(id));
      }
      if (action === 'admin-editor-close') {
        state.adminEditor = null;
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        render();
      }
      if (action === 'admin-editor-save') {
        await submitAdminRevision();
      }
      if (action === 'admin-reject-open') {
        state.rejectModal = { id: Number(id) };
        render();
      }
      if (action === 'admin-reject-close') {
        state.rejectModal = null;
        render();
      }
      if (action === 'admin-reject-submit') {
        await submitAdminReject(Number(id));
      }
      if (action === 'revision-accept') {
        await revisionRespond(Number(id), 'accept');
      }
    });

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function escapeAttr(value) { return escapeHtml(value); }

    let qtyInputBlurTimer = null;
    document.addEventListener(
      'pointerdown',
      (event) => {
        const el = event.target && event.target.closest ? event.target.closest('[data-action]') : null;
        if (!el) return;
        const a = el.dataset.action;
        if (a === 'qty-minus' || a === 'qty-plus' || a === 'remove') {
          window.clearTimeout(qtyInputBlurTimer);
        }
      },
      true,
    );
    document.addEventListener(
      'focusout',
      (event) => {
        const t = event.target;
        if (!t || !t.getAttribute || t.getAttribute('data-action') !== 'qty-input') return;
        const pid = t.dataset.id;
        if (pid == null) return;
        const val = t.value;
        window.clearTimeout(qtyInputBlurTimer);
        qtyInputBlurTimer = window.setTimeout(() => {
          qtyInputBlurTimer = null;
          setQtyFromInput(pid, val);
        }, 200);
      },
      true,
    );

    async function init() {
      render();
      window.setTimeout(() => {
        const splash = document.getElementById('boot-splash');
        if (splash && !splash.classList.contains('boot-splash--done')) {
          setBootMessage('Если долго ждёте — сервер мог уснуть на хостинге, сейчас проснётся…');
        }
      }, 5000);
      try {
        await Promise.all([loadProducts(), loadProfile()]);
        if (state.isAdmin) await loadAdminRequests();
        else await loadRequests();
        const hm = /adminReq=(\d+)/.exec(window.location.hash || '');
        if (hm && state.isAdmin) await openAdminEditor(Number(hm[1]));
      } finally {
        hideBootSplash();
        render();
      }
    }

    init();
  </script>
</body>
</html>
