<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Blossom Flower Farm</title>
  <link rel="preload" href="/miniapp/blossom_logo.png" as="image" type="image/png" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-soft: #f1f3f5;
      --surface-muted: #eceff2;
      --text: #16181d;
      --muted: #6c7380;
      --border: #e4e8ed;
      --primary: #1f7a5b;
      --primary-soft: #e7f5ee;
      --danger: #b42318;
      --danger-soft: #fff3f2;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --shadow: 0 10px 24px rgba(18, 24, 32, .06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    button,
    [role="button"],
    .btn,
    .btn-outline,
    .soft-btn,
    .nav-btn,
    .icon-btn,
    .category-card,
    .checkout-date-edit-wrap,
    input[type="button"],
    input[type="submit"] {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:focus,
    .btn-outline:focus,
    .nav-btn:focus,
    .soft-btn:focus,
    .icon-btn:focus {
      outline: none;
    }
    .btn:focus-visible,
    .btn-outline:focus-visible {
      box-shadow: 0 0 0 2px rgba(31, 122, 91, 0.35);
    }

    .page-refresh-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(246, 247, 248, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .page-refresh-overlay__card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 22px 26px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(228, 232, 237, 0.9);
      box-shadow: var(--shadow);
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 96px;
      background: var(--bg);
      width: 100%;
      min-width: 0;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 16px 14px;
      background: rgba(246,247,248,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(228,232,237,.75);
    }
    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .header-brand {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .header-brand-text {
      min-width: 0;
      flex: 1;
    }
    .header-logo {
      width: 42px;
      height: 42px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid rgba(228,232,237,.9);
      box-shadow: 0 2px 8px rgba(18,24,32,.06);
    }
    .header-salon-logo {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(18,24,32,.06);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .title {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 700;
    }

    .content {
      padding: 16px;
      display: grid;
      gap: 18px;
      max-width: 100%;
      min-width: 0;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .section-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }
    .soft-btn {
      border: 0;
      background: var(--surface-muted);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card, .product-card, .panel, .profile-card, .request-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .category-card {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      cursor: pointer;
      text-align: left;
      box-shadow: var(--shadow);
    }
    .category-card.active {
      background: var(--primary-soft);
      border-color: #b8e1cf;
    }
    .category-name { font-weight: 700; font-size: 15px; }
    .category-meta { margin-top: 4px; color: var(--muted); font-size: 13px; }

    .stack {
      display: grid;
      gap: 12px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .stack > * {
      min-width: 0;
    }

    .product-card {
      padding: 14px;
      transition: transform .15s ease, box-shadow .2s ease;
      box-shadow: 0 8px 28px rgba(18, 24, 32, .055);
    }
    .product-card:hover {
      box-shadow: 0 12px 32px rgba(18, 24, 32, .08);
    }
    .product-card.out {
      background: #eef1f3;
      border-color: #d9dfe5;
      box-shadow: none;
    }
    .product-row {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .thumb {
      width: 118px;
      height: 118px;
      object-fit: cover;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: #f1f3f5;
      cursor: pointer;
    }
    .out .thumb {
      filter: grayscale(1);
      opacity: .72;
    }
    .product-main {
      min-width: 0;
      display: flex;
      min-height: 118px;
      flex-direction: column;
    }
    .product-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .product-name {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: 0;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: flex-start;
      flex-shrink: 0;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid rgba(31, 122, 91, .22);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .pill.out {
      background: #eef1f4;
      color: #5c6570;
      border-color: #d5dbe3;
    }
    .product-card .pill {
      font-size: 13px;
      font-weight: 800;
      padding: 7px 14px;
      letter-spacing: 0.03em;
    }
    .product-price {
      margin-top: 12px;
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }
    .product-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
      width: 100%;
      min-width: 0;
    }
    .product-meta-row .product-price {
      margin-top: 0;
      flex: 1;
      min-width: 0;
    }
    .product-meta-row .product-line-total {
      flex-shrink: 0;
      text-align: right;
      margin-top: 0;
    }
    .product-meta-row--unit {
      justify-content: flex-start;
    }
    .product-cart-price-rail,
    .cart-price-rail {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 8px;
      flex-shrink: 0;
      min-width: 0;
      text-align: right;
    }
    .cart-line-total {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .btn, .btn-outline, .icon-btn {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn {
      flex: 1;
      background: #2f6b52;
      color: white;
      padding: 12px 16px;
      box-shadow: none;
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: .55;
      background: #98a2b3;
    }
    .btn-outline {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
    }
    .btn-cancel-request {
      flex: 1;
      background: rgba(180, 35, 24, 0.1);
      color: #9f2a22;
      border: 1px solid rgba(180, 35, 24, 0.42);
      border-radius: 999px;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-cancel-request:active {
      opacity: 0.88;
      background: rgba(180, 35, 24, 0.16);
    }
    .btn--danger-soft {
      background: rgba(180, 35, 24, 0.1) !important;
      color: #9f2a22 !important;
      border: 1px solid rgba(180, 35, 24, 0.38) !important;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      background: var(--surface-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }
    .qty-stepper .icon-btn.qty-step {
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.03em;
      border: 1px solid rgba(15, 23, 42, 0.14);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .product-hero-frame {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      margin: 0 0 6px;
      box-shadow: 0 16px 48px rgba(15, 23, 42, 0.14);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .product-hero-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.07) 0%, transparent 45%);
      pointer-events: none;
      border-radius: inherit;
    }
    .product-hero {
      width: 100%;
      max-height: min(200px, 42vh);
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 0;
      border: 0;
      background: #f1f3f5;
      display: block;
    }
    .product-hero.out {
      filter: grayscale(1);
      opacity: .8;
    }
    .panel {
      padding: 16px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .detail-card {
      background: var(--surface-soft);
      border-radius: 20px;
      padding: 14px;
    }
    .detail-label { color: var(--muted); font-size: 12px; }
    .detail-value { margin-top: 6px; font-size: 15px; font-weight: 700; }

    .cart-screen {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
    .cart-item {
      padding: 10px 12px;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
    .cart-item .product-top {
      margin-bottom: 0;
      align-items: flex-start;
    }
    .cart-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .cart-trash-rail {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      width: 36px;
    }
    .cart-qty-bottom {
      width: 100%;
      min-width: 0;
      margin-top: 8px;
    }
    .cart-item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .cart-item-body .product-top {
      width: 100%;
    }
    .cart-thumb {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #f1f3f5;
      cursor: pointer;
    }
    .qty-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      border-radius: 999px;
      background: var(--surface-soft);
    }
    .qty-value {
      min-width: 48px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
    }
    .summary {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      background: #111827;
      color: white;
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      color: rgba(255,255,255,.7);
      font-size: 13px;
      min-width: 0;
    }
    .summary-row span:first-child {
      flex: 1;
      min-width: 0;
    }
    .summary-row span:last-child,
    .summary-total span:last-child {
      flex-shrink: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-top: 14px;
      font-size: 24px;
      font-weight: 700;
      color: white;
      min-width: 0;
    }
    .summary-total span:first-child {
      flex: 1;
      min-width: 0;
    }
    .summary-total span:last-child {
      color: white;
    }
    .summary-note { margin-top: 12px; color: rgba(255,255,255,.82); font-size: 13px; }

    .empty, .warning, .success {
      border-radius: 24px;
      padding: 16px;
      font-size: 14px;
    }
    .empty { background: #edf1f4; color: var(--muted); }
    .warning { background: var(--danger-soft); color: var(--danger); border: 1px solid #ffd8d5; }
    .success { background: var(--primary-soft); color: var(--primary); border: 1px solid #bbe5cf; }

    .request-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .request-status {
      background: var(--surface-soft);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
      max-width: 100%;
      text-align: center;
      white-space: normal;
      word-break: break-word;
    }
    .request-status.new { background: #dbeafe; color: #1d4ed8; }
    .request-status.change_requested { background: #fff4e5; color: #b54708; }
    .request-status.approved { background: #eaf6ee; color: #137333; }
    .request-status.rejected, .request-status.cancelled_by_client, .request-status.rejected_by_client { background: #fff1f1; color: var(--danger); }

    .request-card {
      padding: 14px 14px 16px;
    }
    .request-card-headline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .request-card-headline .request-id {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .request-card-headline .request-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .request-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .request-salon-line {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .request-status-badge-row {
      margin-top: 8px;
    }
    .request-status-badge-row .request-status {
      max-width: 100%;
      white-space: normal;
      word-break: break-word;
      text-align: left;
    }
    .admin-request-card {
      border-left: 4px solid var(--primary);
    }
    .admin-request-card.status-new { border-left-color: #2d9d78; }
    .admin-request-card.status-change_requested { border-left-color: #d97706; }
    .admin-request-card.status-approved { border-left-color: #15803d; }
    .admin-request-card.status-rejected,
    .admin-request-card.status-rejected_by_client,
    .admin-request-card.status-cancelled_by_client { border-left-color: #dc2626; }
    .request-card--pulse {
      animation: admin-card-pulse 0.65s ease;
    }
    .request-stat-strip {
      display: flex;
      align-items: stretch;
      margin-top: 12px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-soft);
    }
    .request-stat-cell {
      flex: 1;
      padding: 10px 12px;
      text-align: center;
    }
    .request-stat-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .request-stat-val {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .request-stat-cell:first-child .request-stat-val {
      color: var(--primary);
    }
    .request-stat-div {
      width: 1px;
      background: var(--border);
      flex-shrink: 0;
    }
    .request-date-banner {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.4;
    }
    .request-date-banner .lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .request-lines-grid {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .request-line-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--surface-soft);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    .request-line-thumb {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      background: #e8ecf0;
      flex-shrink: 0;
    }
    .request-line-main {
      min-width: 0;
      flex: 1;
    }
    .request-line-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }
    .request-line-qty {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }
    .request-line-price {
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .request-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .request-card-top-left { min-width: 0; flex: 1; }
    .request-card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      max-width: 52%;
    }
    .request-stems-hero {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--primary);
      margin-top: 12px;
      line-height: 1.1;
    }
    .request-stems-hero span { font-size: 14px; font-weight: 700; color: var(--muted); margin-left: 4px; }
    .request-sum-line {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 700;
    }
    .request-delivery-line {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .request-items-list {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .request-cancel-note {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface-soft);
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
    }
    .profile-card {
      padding: 16px;
    }
    .profile-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #ede9fe;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--text);
      overflow: hidden;

        const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
        const wd = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} года (${wd[d.getDay()]})`;
      } catch (_) {
        return '';
      }
    }

      return state.products.find((item) => item.id === state.selectedProductId) || null;

    function cartItems() {
      return Object.entries(state.cart)
        .map(([id, qty]) => {
          const product = state.products.find((item) => String(item.id) === String(id));
          if (!product || qty <= 0) return null;
          return {
            ...product,
            qty,
            total: qty * Number(product.price || 0),
          };
        })
        .filter(Boolean);
    }

    function cartCount() {
      return cartItems().reduce((sum, item) => sum + item.qty, 0);
    }

    function cartTotal() {
      return cartItems().reduce((sum, item) => sum + item.total, 0);

    function isRetryableApiError(err, res) {
      if (err && err.name === 'TypeError') return true;
      if (res == null) return true;
      const s = res.status;
      return s === 502 || s === 503 || s === 504 || s === 524 || s === 408 || s === 0;
    }

    /** Повторы при «засыпании» Render и сетевых сбоях */
    function normalizeClientRequestRow(r) {
      if (!r || typeof r !== 'object') return r;
      ['items', 'previous_items'].forEach((k) => {
        const v = r[k];
        if (typeof v === 'string') {
          try {
            r[k] = JSON.parse(v);
          } catch {
            r[k] = k === 'items' ? [] : null;
          }
        }
      });
      return r;
    }

    async function apiWakeAware(path, options = {}) {
      const maxAttempts = 14;
      let lastErr = new Error('Сеть недоступна');
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        let res = null;
        try {
          const { headers, ...rest } = options;
          res = await fetch(path, {
            cache: 'no-store',
            ...rest,
            headers: initDataHeaders(headers || {}),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok !== false) return data;
          lastErr = new Error(data.error || `HTTP ${res.status}`);
          if (!isRetryableApiError(null, res)) throw lastErr;
        } catch (e) {
          lastErr = e instanceof Error ? e : new Error(String(e));
          if (!isRetryableApiError(lastErr, res)) throw lastErr;
        }
        setBootMessage('Сервер ненадолго «заснул» — подождите, он просыпается…');
        await sleep(900 + attempt * 350);
      }
      throw lastErr;
    }

        state.meMessage = 'Откройте мини-приложение через Telegram.';
        state.isAdmin = false;
        state.loadingProfile = false;
        updateBootSplashGreeting();
        render();
        return;
      }
      try {
        const data = await apiWakeAware('/api/me', {
          method: 'POST',
          body: JSON.stringify({ telegram_id: tgIdForApi() }),
        });
        state.linked = !!data.linked;
        state.salon = data.salon || null;
        state.meMessage = data.message || '';
        state.isAdmin = !!data.is_admin;
        state.stats = data.stats || { approved_rub: 0, approved_stems: 0 };
      } catch (err) {
        state.linked = false;
        state.salon = null;
        state.meMessage = 'Не удалось загрузить профиль салона.';
        state.isAdmin = false;
        state.stats = { approved_rub: 0, approved_stems: 0 };
      } finally {
        if (spinTimer != null) window.clearTimeout(spinTimer);
        state.loadingProfile = false;
        updateBootSplashGreeting();
        render();
      }
    }

    async function loadProducts(silent = false) {
      if (!silent) {
        state.loadingProducts = true;
        state.catalogRefreshBlocking = true;
        render();
      }
      try {
        const data = await apiWakeAware('/api/products');
        state.products = data.products || [];
        state.categories = data.categories || [{ id: 'all', name: 'Все', count: state.products.length }];
        state.apiError = '';
      } catch (err) {
        state.apiError = err.message || 'Не удалось загрузить каталог';
      } finally {
        state.loadingProducts = false;
        state.catalogRefreshBlocking = false;
        render();
      }
    }

    async function loadRequests(silent = false) {
      if (!state.telegramId) return;
      if (!silent) {
        state.loadingRequests = true;
        state.requestsRefreshBlocking = true;
        render();
      }
      try {
        const data = await apiWakeAware('/api/my-requests', {
          method: 'POST',
          body: JSON.stringify({ telegram_id: tgIdForApi() }),
        });
        state.requests = (data.requests || []).map(normalizeClientRequestRow);
      } catch (err) {
        if (!silent) state.requests = [];
      } finally {
        state.loadingRequests = false;
        state.requestsRefreshBlocking = false;
        render();
      }
    }

    function addToCart(product) {
      if (!canSalonOrder()) {
        showNotice('Корзина доступна только привязанным салонам');
        return;
      }
      if (!product.available) return;
      delete state.qtyDraft[String(product.id)];
      state.cart[product.id] = 5;
      haptic('light');
      showNotice(`${product.name} · 5 стеблей в корзине`);
    }

    function changeQty(productId, delta) {
      const k = String(productId);
      const product = state.products.find((p) => String(p.id) === String(productId));
      let current = state.cart[productId] || state.cart[k] || 0;
      if (state.qtyDraft[k] !== undefined) {
        const p = parseInt(String(state.qtyDraft[k]).replace(/\D/g, ''), 10);
        if (Number.isFinite(p)) current = p;
      }
      delete state.qtyDraft[k];
      let next = current + delta;
      if (next <= 0) {
        delete state.cart[productId];
      } else {
        const maxStock = product && Number.isFinite(Number(product.stock)) ? Number(product.stock) : null;
        if (maxStock != null && next > maxStock) {
          next = maxStock;
          showNotice(`В наличии не более ${maxStock} шт.`);
        }
        state.cart[productId] = next;
      }
      render();
    }

    function setQtyFromInput(productId, raw) {
      delete state.qtyDraft[String(productId)];
      const product = state.products.find((p) => String(p.id) === String(productId));
      const digits = String(raw || '').replace(/\D/g, '');
      const v = parseInt(digits, 10);
      if (!Number.isFinite(v) || v < 1) {
        delete state.cart[productId];
      } else {
        let next = v;
        const maxStock = product && Number.isFinite(Number(product.stock)) ? Number(product.stock) : null;
        if (maxStock != null && next > maxStock) {
          next = maxStock;
          showNotice(`В наличии не более ${maxStock} шт.`);
        }
        state.cart[productId] = next;
      }
      render();
    }

    function openProduct(productId) {
      state.selectedProductId = productId;
      state.activeTab = 'product';
      render();
    }

    async function submitOrder() {
      const items = cartItems();
      if (!items.length || state.submitting) return;
      const dd = (state.deliveryDate || '').trim().slice(0, 10);
      if (!dd || dd.length < 10) {
        showNotice('Укажите желаемую дату поставки');
        render();
        return;
      }
      if (dd < todayIsoLocal()) {
        state.deliveryDate = todayIsoLocal();
        showNotice('Дата поставки не может быть раньше сегодняшней.');
        render();
        return;
      }
      state.submitting = true;
      window.clearTimeout(actionOverlayTimer);
      state.actionOverlay = { phase: 'loading', variant: 'order', loadingText: 'Оформляем заявку…' };
      render();
      try {
        await Promise.all([
          api('/api/order', {
            method: 'POST',
            body: JSON.stringify({
              telegram_id: tgIdForApi(),
              telegram_name: state.telegramName,
              telegram_username: state.telegramUsername,
              delivery_date: dd,
              items: items.map((item) => ({
                id: item.id,
                name: item.name,
                qty: item.qty,
                price: item.price,
              })),
            }),
          }),
          sleep(580),
        ]);
        state.cart = {};
        state.qtyDraft = {};
        state.deliveryDate = '';
        state.activeTab = 'orders';
        await loadRequests(true);
        await loadProducts(true);
        notifySuccess();
        state.actionOverlay = {
          phase: 'success',
          variant: 'order',
          title: 'Заявка отправлена',
          sub: 'Менеджер увидит её в Telegram',
        };
        render();
        await sleep(1750);
        state.actionOverlay = null;
        showNotice('Заявка отправлена менеджеру');
      } catch (err) {
        state.actionOverlay = null;
        showNotice(err.message || 'Не удалось отправить заявку');
      } finally {
        state.submitting = false;
        render();
      }
    }

    async function cancelRequest(requestId) {
      window.clearTimeout(actionOverlayTimer);
      state.actionOverlay = { phase: 'loading', variant: 'cancel', loadingText: 'Отменяем заявку…' };
      render();
      try {
        await Promise.all([
          api('/api/request/cancel', {
            method: 'POST',
            body: JSON.stringify({ telegram_id: tgIdForApi(), request_id: requestId }),
          }),
          sleep(450),
        ]);
        await loadRequests(true);
        await loadProducts(true);
        notifySuccess();
        state.actionOverlay = {
          phase: 'success',
          variant: 'cancel',
          title: 'Заявка отменена',
          sub: 'Резерв по позициям снят',
        };
        render();
        await sleep(2000);
        state.actionOverlay = null;
        showNotice('Заявка отменена');
      } catch (err) {
        state.actionOverlay = {
          phase: 'error',
          variant: 'cancel-fail',
          title: 'Не удалось отменить',
          sub: 'Обновите страницу, чтобы увидеть актуальный статус заявки.',
        };
        render();
        await sleep(2200);
        state.actionOverlay = null;
        showNotice(translateApiError(err.message) || 'Не удалось отменить заявку');
      }
      render();
    }

      if (!tg?.MainButton) return;
      try { tg.MainButton.offClick(submitOrder); } catch (_) {}
      try { tg.MainButton.offClick(goToCheckout); } catch (_) {}
      try { tg.MainButton.offClick(openCart); } catch (_) {}
      try { tg.BackButton.offClick(goBack); } catch (_) {}
      try { tg.MainButton.hide(); } catch (_) {}

      if (state.adminEditor || state.activeTab === 'product' || state.activeTab === 'checkout') {
        tg.BackButton.show();
        tg.BackButton.onClick(goBack);
      } else {
        tg.BackButton.hide();
      }
    }

      state.activeTab = 'checkout';
      render();

    function goBack() {
      if (state.adminEditor) {
        state.adminEditor = null;
        window.history.replaceState(null, '', window.location.pathname + window.location.search);

        return;

      if (state.activeTab === 'product') {

    function productLineTotalRub(item) {
      const k = String(item.id);
      let q = state.cart[item.id] || state.cart[k] || 0;
      if (state.qtyDraft[k] !== undefined) {
        const p = parseInt(String(state.qtyDraft[k]).replace(/\D/g, ''), 10);
        if (Number.isFinite(p)) q = p;
      }
      const pr = Number(item.price) || 0;
      return Math.round(pr * q);
    }

    function requestItemsSnapshotKey(items) {
      const rows = (items || []).map((r) => [
        String(r.id ?? ''),
        Number(r.qty || r.quantity || 0),
        Number(String(r.price ?? '').replace(',', '.')) || 0,
      ]);
      rows.sort((a, b) => String(a[0]).localeCompare(String(b[0])));
      return JSON.stringify(rows);
    }

    function buildClientRequestDetailsInner(item) {
      const note = (item.status === 'rejected' && item.manager_note) ? escapeHtml(item.manager_note) : '';
      const dIso = item.delivery_date ? String(item.delivery_date).slice(0, 10) : '';
      const dHuman = dIso ? formatCheckoutDateShort(dIso) : '';
      const dWeek = dIso ? weekdayFullRu(dIso) : '';
      const prevItems = item.previous_items || [];
      const curItems = item.items || [];
      const prevD = item.previous_delivery_date ? String(item.previous_delivery_date).slice(0, 10) : '';
      const dateChanged = item.status === 'change_requested' && prevD && prevD !== dIso;
      const itemsChanged = item.status === 'change_requested' && prevItems.length > 0
        && requestItemsSnapshotKey(prevItems) !== requestItemsSnapshotKey(curItems);
      const createdLine = item.created_at
        ? `<div class="admin-created-line muted">Создана: ${escapeHtml(formatAdminShortDate(item.created_at))} · ${escapeHtml(formatAdminTime(item.created_at))}</div>`
        : '';

      const clientRevision = item.status === 'change_requested'
        ? `
                <div class="revision-banner" style="margin-top:12px;">
                  <b>Менеджер внёс изменения.</b> Ниже — актуальное предложение. Примите или отклоните.

                  <button class="btn-cancel-request" type="button" data-action="cancel-request" data-id="${item.id}">Отклонить заявку</button>
                </div>
              `
        : '';

      const clientCancelNew = item.status === 'new'
        ? `
                <div class="actions" style="margin-top:14px;">
                  <button class="btn-cancel-request" type="button" data-action="cancel-request" data-id="${item.id}">Отменить заявку</button>
                </div>
              `
        : '';

      return `
              ${createdLine}
              <div class="request-stat-strip">

    function formatAdminDayLabel(dayKey) {
      if (!dayKey || dayKey === 'unknown') return 'Без даты поставки';
      const d = new Date(`${dayKey}T12:00:00.000Z`);
      return d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatAdminShortDate(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
      } catch (_) {
        return '—';
      }
    }

    function formatAdminTime(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      } catch (_) {
        return '';
      }
    }

    function filterAdminRequestsBySalon(requests, salonFilter) {
      if (!salonFilter || salonFilter === 'all') return [...requests];
      return requests.filter((r) => ((r.salon_name || '').trim() || '—') === salonFilter);
    }

    function adminSalonFilterOptions(requests) {
      const set = new Set();
      requests.forEach((r) => set.add(((r.salon_name || '').trim() || '—')));
      return [...set].sort((a, b) => a.localeCompare(b, 'ru'));
    }

    function buildAdminRequestBoard(requests) {
      const list = [...requests].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      const byDate = new Map();
      for (const r of list) {
        let dayKey = 'unknown';
        const raw = r.delivery_date;
        if (raw) {
          try {
            dayKey = String(raw).slice(0, 10);
            if (dayKey.length < 10) dayKey = 'unknown';
          } catch (_) {}
        }
        if (!byDate.has(dayKey)) byDate.set(dayKey, []);
        byDate.get(dayKey).push(r);
      }
      const dates = [...byDate.keys()].sort((a, b) => {
        if (a === 'unknown') return 1;
        if (b === 'unknown') return -1;
        return b.localeCompare(a);
      });
      return dates.map((dayKey) => {
        const rows = byDate.get(dayKey);
        const bySalon = new Map();
        for (const r of rows) {
          const sn = (r.salon_name || '').trim() || '—';
          if (!bySalon.has(sn)) bySalon.set(sn, []);
          bySalon.get(sn).push(r);
        }
        const salons = [...bySalon.keys()].sort((a, b) => a.localeCompare(b, 'ru'));
        return {
          dayKey,
          dayLabel: formatAdminDayLabel(dayKey),
          salons: salons.map((name) => ({
            name,
            requests: bySalon.get(name).sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)),
          })),
        };
      });
    }

    function buildClientRequestBoard(requests) {
      const list = [...requests].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      const byDate = new Map();
      for (const r of list) {
        let dayKey = 'unknown';
        const raw = r.delivery_date;
        if (raw) {
          try {
            dayKey = String(raw).slice(0, 10);
            if (dayKey.length < 10) dayKey = 'unknown';
          } catch (_) {}
        }
        if (!byDate.has(dayKey)) byDate.set(dayKey, []);
        byDate.get(dayKey).push(r);
      }
      const dates = [...byDate.keys()].sort((a, b) => {
        if (a === 'unknown') return 1;
        if (b === 'unknown') return -1;
        return b.localeCompare(a);
      });
      return dates.map((dayKey) => ({
        dayKey,
        dayLabel: formatAdminDayLabel(dayKey),
        requests: byDate.get(dayKey).sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)),
      }));
    }

                    <div class="product-name">${escapeHtml(f.name)}</div>
                    <div class="admin-input-row">
                      <input type="text" inputmode="decimal" data-admin-flower-price data-id="${f.id}" value="${f.price_rub != null && f.price_rub !== '' ? escapeHtml(String(f.price_rub)) : ''}" placeholder="Цена ₽" />
                      <input type="text" inputmode="numeric" data-admin-flower-stock data-id="${f.id}" value="${f.stems_count != null && f.stems_count !== '' ? escapeHtml(String(f.stems_count)) : ''}" placeholder="Остаток (шт.)" />
                    </div>
                  </div>
                  <label class="toggle-row" style="flex-direction:column;align-items:flex-end;min-width:88px;">
                    <span class="muted" style="font-size:10px;font-weight:700;">В каталоге</span>
                    <input type="checkbox" data-admin-flower-vis data-id="${f.id}" ${f.catalog_visible !== false ? 'checked' : ''} />
                  </label>
                </div>
              `).join('')}
              <button class="btn" type="button" data-action="admin-save-catalog" style="width:100%;margin-top:18px;">Сохранить в базе</button>
              <button class="btn-outline" type="button" data-action="broadcast-open" style="width:100%;margin-top:10px;">Отправка рассылки</button>
            </div>
          </section>
        `;
    }

    function renderActionOverlay() {
      const ov = state.actionOverlay;
      if (!ov) return '';
      if (ov.phase === 'loading') {
        return `
        <div class="order-success-overlay" aria-live="polite">
          <div class="order-success-panel order-success-card">
            <div class="action-overlay-spinner"></div>
            <p class="action-overlay-loading-text">${escapeHtml(ov.loadingText || 'Подождите…')}</p>
          </div>
        </div>`;
      }
      if (ov.phase === 'error') {
        return `
        <div class="order-success-overlay" aria-live="polite">
          <div class="order-success-panel order-success-card">
            <svg class="action-overlay-error-icon" viewBox="0 0 52 52" aria-hidden="true">
              <circle cx="26" cy="26" r="23" fill="none" stroke="currentColor" stroke-width="2.5"/>
              <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M18 18l16 16M34 18L18 34"/>
            </svg>
            <p class="order-success-title">${escapeHtml(ov.title || 'Ошибка')}</p>
            <p class="order-success-sub">${escapeHtml(ov.sub || '')}</p>
          </div>
        </div>`;
      }
      const isRoseSuccess =
        ov.variant === 'cancel'
        || ov.variant === 'revision-reject'
        || ov.variant === 'admin-delete-ok';
      const iconWrapStyle = isRoseSuccess
        ? 'background:#fff1f2;color:#c53030;'
        : '';
      return `
        <div class="order-success-overlay" aria-live="polite">
          <div class="order-success-panel order-success-card">
            <div class="order-success-icon-wrap" style="${iconWrapStyle}">
              <svg class="order-success-check" viewBox="0 0 52 52" aria-hidden="true">
                <circle class="order-success-circle" cx="26" cy="26" r="23" fill="none" stroke="currentColor" stroke-width="2.5"/>
                <path class="order-success-tick" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14 27l9 9 17-20"/>
              </svg>
            </div>
            <p class="order-success-title">${escapeHtml(ov.title || 'Готово')}</p>
            <p class="order-success-sub">${escapeHtml(ov.sub || '')}</p>
          </div>
        </div>
      `;
    }

    function renderNav() {
      const n = cartCount();
      if (state.isAdmin) {
        const tabs = [
          ['home', iconNav.home, 'Каталог'],
          ['orders', iconNav.orders, 'Заявки'],
          ['profile', iconNav.person, 'Профиль'],
          ['admin', iconNav.admin, 'Админ'],
        ];
        return `
        <nav class="bottom-nav">
          <div class="nav-grid cols-4">
            ${tabs.map(([tab, iconHtml, label]) => `
              <button class="nav-btn ${state.activeTab === tab ? 'active' : ''}" data-action="tab" data-tab="${tab}" type="button">
                <span class="nav-icon">${iconHtml}</span>
                <span>${label}</span>
              </button>
            `).join('')}
          </div>
        </nav>
      `;
      }
      const tabs = [
        ['home', iconNav.home, 'Каталог'],
        ['orders', iconNav.orders, 'Заявки'],
        ['profile', iconNav.person, 'Профиль'],
        ['cart', iconNav.cart, 'Корзина'],
      ];
      return `
        <nav class="bottom-nav">
          <div class="nav-grid cols-4">
            ${tabs.map(([tab, iconHtml, label]) => {
              const iconInner = tab === 'cart' && n > 0
                ? `<span class="nav-icon-wrap">${iconHtml}<span class="nav-badge">${n}</span></span>`
                : iconHtml;
              return `
              <button class="nav-btn ${state.activeTab === tab ? 'active' : ''}" data-action="tab" data-tab="${tab}" type="button">
                <span class="nav-icon">${iconInner}</span>
                <span>${label}</span>
              </button>`;
            }).join('')}
          </div>
        </nav>
      `;
    }

    function render() {
      if (!state.actionOverlay && state.pendingNotice) {
        state.notice = state.pendingNotice;
        state.pendingNotice = '';
        window.clearTimeout(showNotice._timer);
        showNotice._timer = window.setTimeout(() => {
          state.notice = '';
          render();
        }, 2500);
      }
      const app = document.getElementById('app');
      const ae = document.activeElement;
      let qtyFocusId = null;
      let qtySelStart = null;
      let qtySelEnd = null;
      if (ae && ae.getAttribute && ae.getAttribute('data-action') === 'qty-input' && ae.dataset && ae.dataset.id != null) {
        qtyFocusId = String(ae.dataset.id);
        try {
          qtySelStart = ae.selectionStart;
          qtySelEnd = ae.selectionEnd;
        } catch (_) {}
      }
      const screen = state.activeTab === 'admin' ? renderAdmin()
        : state.activeTab === 'home' ? renderHome()
        : state.activeTab === 'product' ? renderProduct()
        : state.activeTab === 'cart' ? renderCart()
        : state.activeTab === 'checkout' ? renderCheckout()
        : state.activeTab === 'orders' ? renderOrdersView()
        : renderProfile();

      app.innerHTML = `
        <div class="app">
          ${renderHeader()}
          <main class="content">
            ${state.apiError ? `<div class="warning">${escapeHtml(state.apiError)}</div>` : ''}
            ${screen}
          </main>
          ${renderNav()}
          ${state.notice ? `<div class="toast">${escapeHtml(state.notice)}</div>` : ''}
        </div>
        ${renderAdminEditorModal()}
        ${renderRejectModal()}
        ${renderBroadcastModal()}
        ${renderStockLockTipLayer()}
      `;

      syncQtyInputsFromState(app);
      if (qtyFocusId != null) {
        const inp = app.querySelector('[data-action="qty-input"][data-id="' + qtyFocusId + '"]');
        if (inp && typeof inp.focus === 'function') {
          const k = String(qtyFocusId);
          const q = state.cart[qtyFocusId] || state.cart[k] || 0;
          const displayVal = state.qtyDraft[k] !== undefined ? state.qtyDraft[k] : String(q > 0 ? q : '');
          inp.value = displayVal;
          inp.focus();
          if (qtySelStart != null && typeof inp.setSelectionRange === 'function') {
            try { inp.setSelectionRange(qtySelStart, qtySelEnd); } catch (_) {}
          }
        }
      }

      updateTelegramButtons();
      syncGlobalOverlay();
      if (state.adminEditor) {
        window.requestAnimationFrame(() => refreshAdminEditorSubmitState());
      }
    }

    document.addEventListener('change', (event) => {
      const t = event.target;
      if (t && t.matches && t.matches('[data-checkout-delivery]')) {
        const raw = (t.value || '').slice(0, 10);
        state.deliveryDate = normalizeSelectableDate(raw);
        if (raw && raw !== state.deliveryDate) {
          t.value = state.deliveryDate;
          showNotice('Дата поставки не может быть раньше сегодняшней.');
        }
        render();
        return;
      }
      if (t && t.matches && t.matches('[data-action="admin-filter-salon"]')) {
        const v = t.value;
        state.adminSalonFilter = v === 'all' ? 'all' : decodeURIComponent(v);
        render();
        return;
      }
      if (t && t.matches && t.matches('[data-admin-flower-vis]')) {
        const fid = Number(t.dataset.id);
        const f = state.adminFlowers.find((x) => x.id === fid);
        if (f) f.catalog_visible = t.checked;
      }
      if (t && t.matches && t.matches('[data-admin-revise-delivery]')) {
        const raw = (t.value || '').slice(0, 10);
        if (raw && raw < todayIsoLocal()) {
          t.value = todayIsoLocal();
          showNotice('Дата поставки не может быть раньше сегодняшней.');
        }
        refreshAdminEditorSubmitState();
      }
    });
    document.addEventListener('input', (event) => {
      const t = event.target;
      if (t && t.matches && t.matches('[data-action="qty-input"]')) {
        event.stopPropagation();
        const pid = t.dataset.id;
        if (pid != null) state.qtyDraft[String(pid)] = t.value;
        return;
      }
      if (t && t.matches && t.matches('[data-admin-flower-price]')) {
        const fid = Number(t.dataset.id);
        const f = state.adminFlowers.find((x) => x.id === fid);
        if (f) {
          const v = t.value.trim();
          f.price_rub = v === '' ? null : v.replace(',', '.');
        }
      }
      if (t && t.matches && t.matches('[data-admin-flower-stock]')) {
        const fid = Number(t.dataset.id);
        const f = state.adminFlowers.find((x) => x.id === fid);
        if (f) {
          const v = t.value.trim();
          f.stems_count = v === '' ? null : v;
        }
      }
      if (t && t.matches && t.matches('[data-admin-revise-qty], [data-admin-revise-price], [data-admin-revise-comment]')) {
        refreshAdminEditorSubmitState();
      }
    });

    document.addEventListener('click', async (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      if (action === 'tab') {
        setActiveTab(target.dataset.tab);
      }
      if (action === 'category') {
        state.activeCategory = target.dataset.category;
        render();
      }
      if (action === 'reset-category') {
        state.activeCategory = 'all';
        render();
      }
      if (action === 'open-product') {
        openProduct(Number(id));
      }
      if (action === 'add') {
        const product = state.products.find((item) => String(item.id) === String(id));
        if (product) addToCart(product);
      }
      if (action === 'qty-delta') {
        const d = Number(target.dataset.delta);
        if (Number.isFinite(d)) changeQty(id, d);
      }
      if (action === 'go-checkout') {
        goToCheckout();
      }
      if (action === 'submit-order') {
        await submitOrder();
      }
      if (action === 'admin-toggle-req') {
        const rid = Number(id);
        if (!Number.isFinite(rid)) return;
        state.adminExpandedRequestIds[rid] = !state.adminExpandedRequestIds[rid];
        render();
      }
      if (action === 'client-toggle-req') {
        const rid = Number(id);
        if (!Number.isFinite(rid)) return;
        state.clientExpandedRequestIds[rid] = !state.clientExpandedRequestIds[rid];
        render();
      }
      if (action === 'remove') {
        changeQty(id, -999999);
      }
      if (action === 'reload-catalog') {
        await loadProducts(false);
      }
      if (action === 'reload-requests') {
        if (state.isAdmin) await loadAdminRequests(false);
        else await loadRequests(false);
      }
      if (action === 'admin-reload-requests') {
        await loadAdminRequests(false);
      }
      if (action === 'admin-approve-req') {
        await adminApproveRequest(Number(id));
      }
      if (action === 'admin-delete-req') {
        await adminDeleteRequest(Number(id));
      }
      if (action === 'cancel-request') {
        await cancelRequest(id);
      }
      if (action === 'admin-reload-catalog') {
        await loadAdminCatalog(false);
      }
      if (action === 'admin-save-catalog') {
        try {
          await saveAdminCatalog();
        } catch (e) {
          showNotice(e.message || 'Ошибка сохранения');
        }
      }
      if (action === 'admin-open-req') {
        await openAdminEditor(Number(id));
      }
      if (action === 'admin-editor-close') {
        state.adminEditor = null;
        state.adminEditorBaseline = null;
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        render();
      }
      if (action === 'stock-lock-info') {
        event.preventDefault();
        event.stopPropagation();
        const pid = target.dataset.id != null ? String(target.dataset.id) : '';
        const r = target.getBoundingClientRect();
        const pad = 14;
        const vw = window.innerWidth || 360;
        const cx = Math.min(vw - pad, Math.max(pad, r.left + r.width / 2));
        const by = r.bottom + 10;
        const cur = state.stockLockTip;
        if (cur && String(cur.pid) === pid) {
          state.stockLockTip = null;
        } else {
          state.stockLockTip = { cx, by, pid };
        }
        render();
        return;
      }
      if (action === 'stock-lock-tip-dismiss') {
        state.stockLockTip = null;
        render();
        return;
      }
      if (action === 'admin-editor-save') {
        await submitAdminRevision();
      }
      if (action === 'admin-reject-open') {
        state.rejectModal = { id: Number(id) };
        render();
      }
      if (action === 'admin-reject-close') {
        state.rejectModal = null;
        render();
      }
      if (action === 'admin-reject-submit') {
        await submitAdminReject(Number(id));
      }
      if (action === 'revision-accept') {
        await revisionRespond(Number(id), 'accept');
      }
      if (action === 'broadcast-open') {
        await openBroadcastModal();
      }
      if (action === 'broadcast-close') {
        closeBroadcastModal();
      }
      if (action === 'broadcast-back') {
        if (state.broadcastModal) state.broadcastModal.step = 'pick';
        render();
      }
      if (action === 'broadcast-next') {
        if (state.broadcastModal && Object.keys(state.broadcastModal.selected || {}).length) {
          state.broadcastModal.step = 'confirm';
          render();
        }
      }
      if (action === 'broadcast-toggle') {
        const sid = target.dataset.salonId;
        if (state.broadcastModal && sid != null) {
          const k = String(sid);
          if (!state.broadcastModal.selected) state.broadcastModal.selected = {};
          if (state.broadcastModal.selected[k]) delete state.broadcastModal.selected[k];
          else state.broadcastModal.selected[k] = true;
          render();
        }
      }
      if (action === 'broadcast-send') {
        await sendBroadcast();
      }
    });

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function escapeAttr(value) { return escapeHtml(value); }

    let qtyInputBlurTimer = null;
    document.addEventListener(
      'pointerdown',
      (event) => {
        const el = event.target && event.target.closest ? event.target.closest('[data-action]') : null;
        if (!el) return;
        const a = el.dataset.action;
        if (a === 'qty-delta' || a === 'remove') window.clearTimeout(qtyInputBlurTimer);
      },
      true,
    );
    document.addEventListener(
      'focusout',
      (event) => {
        const t = event.target;
        if (!t || !t.getAttribute || t.getAttribute('data-action') !== 'qty-input') return;
        const pid = t.dataset.id;
        if (pid == null) return;
        const val = t.value;
        window.clearTimeout(qtyInputBlurTimer);
        qtyInputBlurTimer = window.setTimeout(() => {
          qtyInputBlurTimer = null;
          setQtyFromInput(pid, val);
        }, 120);
      },
      true,
    );

    async function init() {
      startBootSplashPhraseLoop();
      render();
      try {
        await loadProfile();
        await loadProducts(true);
        if (state.isAdmin) await loadAdminRequests(true);
        else await loadRequests(true);
        const hm = /adminReq=(\d+)/.exec(window.location.hash || '');
        if (hm && state.isAdmin) await openAdminEditor(Number(hm[1]));
      } finally {
        updateBootSplashGreeting();
        hideBootSplash();
        render();
      }
    }

    window.setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      loadProducts(true);
      if (state.isAdmin) {
        if (state.activeTab === 'orders') loadAdminRequests(true);
        if (state.activeTab === 'admin') loadAdminCatalog(true);
      } else if (state.telegramId) {
        loadRequests(true);
      }
    }, 48000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      loadProducts(true);
      if (state.isAdmin) {
        loadAdminRequests(true);
        loadAdminCatalog(true);
      } else if (state.telegramId) {
        loadRequests(true);
      }
    });

    init();
  </script>
</body>
</html>
